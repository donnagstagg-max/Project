<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Page metadata and global stylesheet linking. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noongar Seasons and Country Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Main app shell: wraps the header and all dynamic screen content. -->
    <div class="app-shell">
      <!-- Top bar containing home/back navigation controls and the page title. -->
      <header class="topbar">
        <nav class="nav-controls" aria-label="Page navigation">
          <button id="homeButton" class="hidden" type="button">Home</button>
          <button id="backButton" class="hidden" type="button" aria-label="Go back">← Back</button>
        </nav>
        <h1>Noongar Seasons and Country Explorer</h1>
      </header>

      <!-- This container is populated dynamically by JavaScript with the season, ILUA, category, and species views. -->
      <main id="appView" aria-live="polite"></main>
    </div>

    <!-- JavaScript that loads CSV data, renders each screen, and handles navigation and interaction. -->
    <script src="app.js"></script>
  </body>
</html>
